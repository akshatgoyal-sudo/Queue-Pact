[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "queuepact"
version = "0.4.0"
description = "Deterministic admission queue simulation"
requires-python = ">=3.11"
dependencies = ["simpy>=4.1,<5", "nicegui>=3.0,<4", "plotly>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
verification = ["playwright>=1.55,<2", "pypdf>=6,<7"]

[project.scripts]
queuepact = "queuepact.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
queuepact = ["ui/*.js", "ui/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
